id = "spotify-soloist"
name = "Spotify Connect (Soloist)"
version = "1.0.0"
entry = "service.sh"
description = "Автономный Spotify Connect плеер без PulseAudio с прямым ALSA-выводом и Hi-Fi калибровкой"
permissions = ["exec", "clock"]

[launch]
kind = "binary"
mode = "service"
path = "service.sh"
args = ["start_fg"]

[compatibility]
models = ["yandexmini2", "yandexmini_2", "yandexmicro", "yandexmidi"]
features = ["arch.armhf"]
